
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusLend | Admin Dashboard</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">

    <style>
        .admin-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .admin-header h1 {
            margin: 0;
        }

        .admin-label {
            display: inline-block;
            background: #eee8ff;
            color: #6841c6;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.06);
        }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            margin-top: 0;
        }

        .stat-card p {
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 0;
        }

        .admin-section {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.06);
        }

        .admin-message {
            margin-top: 15px;
            color: #b42318;
        }

        .logout-button {
            padding: 11px 20px;
            border: none;
            border-radius: 8px;
            background: #b42318;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header class="navbar">
        <a href="index.html" class="brand">CampusLend</a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="browse.html">Browse</a>
            <button id="adminLogout" class="logout-button">
                Logout
            </button>
        </nav>
    </header>


    <main class="admin-container">

        <div class="admin-header">
            <div>
                <span class="admin-label">ADMIN PANEL</span>
                <h1>Welcome, Administrator</h1>
                <p>Manage and monitor the CampusLend platform.</p>
            </div>
        </div>


        <section class="admin-stats">

            <div class="stat-card">
                <h3>Total Users</h3>
                <p id="totalUsers">--</p>
            </div>

            <div class="stat-card">
                <h3>Total Resources</h3>
                <p id="totalResources">--</p>
            </div>

            <div class="stat-card">
                <h3>Borrow Requests</h3>
                <p id="totalRequests">--</p>
            </div>

            <div class="stat-card">
                <h3>Pending Requests</h3>
                <p id="pendingRequests">--</p>
            </div>

        </section>


        <section class="admin-section">
            <h2>Admin Dashboard</h2>

            <p>
                Welcome to the CampusLend administration area.
                Platform management features will appear here.
            </p>

            <p id="adminMessage" class="admin-message"></p>
        </section>

    </main>


    <script type="module" src="admin.js"></script>

</body>
</html>
